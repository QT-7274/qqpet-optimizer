feature:
  name: menu-bar-status-settings
  product: qqpet-optimizer
  description: Menu Bar 状态窗右上角提供齿轮，单击打开独立系统设置窗口，与右键 openSetup 共用同一窗口且不重复创建。

components:
  GEAR:
    requirements:
      1: 状态窗顶栏关闭按钮左侧有齿轮，且紧挨关闭按钮。
      2: 关闭按钮仍可关闭状态窗。
  OPEN:
    requirements:
      1: 单击齿轮打开系统设置，且与右键菜单 openSetup 为同一窗口。
      2: 系统设置已打开时，再次单击齿轮应前置显示已有窗口，不得新建第二个。
  MENU:
    requirements:
      1: 右键菜单「设置及帮助 → 系统设置」仍可打开系统设置。
  BOUNDARY:
    requirements:
      1: 不得把设置表单嵌进状态窗。

constraints:
  TESTS:
    requirements:
      1: 上述行为应有对应单元测试，并在测试名或注释中引用完整 ACID。
