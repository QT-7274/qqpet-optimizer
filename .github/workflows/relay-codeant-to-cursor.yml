# Forwards CodeAnt GitHub App review completion to a Cursor Automation webhook.
# Cursor GitHub triggers drop bot/App reviews; this bypasses that filter.
#
# CodeAnt completion signals in this repo:
# - First review with inline comments: pull_request_review submitted by codeant-ai[bot]
# - First review with no inlines: Status comment edited to "✅ Reviewed your PR"
# - Incremental review on a new SHA: Status comment edited to
#   "✅ Incremental review completed" (often no new Submit review)
# - Legacy (early PRs): "CodeAnt AI finished running the review."
#
# issue_comment completions are skipped when codeant-ai already submitted a
# review on the same SHA, so the Status edit does not double-ping Cursor.
name: Relay CodeAnt review to Cursor

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]

concurrency:
  group: relay-codeant-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  relay:
    if: |
      (github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'codeant-ai[bot]') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'codeant-ai[bot]' &&
        (contains(github.event.comment.body, 'CodeAnt AI finished running the review') ||
          contains(github.event.comment.body, 'Incremental review completed') ||
          contains(github.event.comment.body, '✅ Reviewed your PR')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Ping Cursor webhook
        env:
          URL: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_URL }}
          TOKEN: ${{ secrets.CURSOR_AUTOMATION_WEBHOOK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_URL: ${{ github.event.review.html_url || github.event.comment.html_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "Missing CURSOR_AUTOMATION_WEBHOOK_URL or CURSOR_AUTOMATION_WEBHOOK_TOKEN"
            exit 1
          fi
          if [ -z "${SHA:-}" ]; then
            SHA="$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)"
          fi
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            REVIEW_COUNT="$(
              gh api "repos/${REPO}/pulls/${PR}/reviews" \
                --jq --arg sha "$SHA" \
                '[.[] | select(.user.login == "codeant-ai[bot]" and .commit_id == $sha)] | length'
            )"
            if [ "$REVIEW_COUNT" != "0" ]; then
              echo "Skip status comment; pull_request_review already covers ${SHA:0:7}"
              exit 0
            fi
          fi
          case "$TOKEN" in
            Bearer\ *) AUTH="$TOKEN" ;;
            *) AUTH="Bearer $TOKEN" ;;
          esac
          echo "Relaying ${EVENT_NAME} for PR ${PR} sha=${SHA}"
          HTTP_CODE="$(
            curl -sS -o /tmp/cursor-webhook-body.txt -w "%{http_code}" -X POST "$URL" \
              -H "Authorization: $AUTH" \
              -H "Content-Type: application/json" \
              --data "{\"source\":\"codeant-ai\",\"repo\":\"${REPO}\",\"pr\":${PR},\"sha\":\"${SHA}\",\"reviewUrl\":\"${REVIEW_URL}\",\"event\":\"${EVENT_NAME}\"}"
          )"
          echo "Cursor webhook HTTP ${HTTP_CODE}"
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            cat /tmp/cursor-webhook-body.txt
            exit 1
          fi
